<div class="tabs" id="logs-tabs">
  <div class="tab active" data-src="static:nginx_access" onclick="logsSelect(this)">Nginx Access</div>
  <div class="tab" data-src="static:nginx_error" onclick="logsSelect(this)">Nginx Error</div>
  <div class="tab" data-src="static:system" onclick="logsSelect(this)">Sistema</div>
  <div class="tab" data-src="errors" onclick="logsSelect(this)"><i class="ti ti-alert-triangle"></i> Errores</div>
  <div class="tab" data-src="audit" onclick="logsSelect(this)">Auditoría</div>
  <div class="tab" data-src="security" onclick="logsSelect(this)">🛡️ Seguridad</div>
  <div class="tab" data-src="fail2ban" onclick="logsSelect(this)">🚫 Fail2Ban</div>
</div>
<div class="card" id="logs-card">
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
    <select id="logs-app-select" onchange="logsSelectApp()" style="min-width:150px">
      <option value="">Apps (PM2)…</option>
    </select>
    <select id="logs-site-select" onchange="logsSelectSite()" style="min-width:150px">
      <option value="">Sitios web…</option>
    </select>
    <select id="logs-site-kind" onchange="logsSelectSite()" style="display:none">
      <option value="access">access</option>
      <option value="error">error</option>
    </select>
    <span id="logs-errors-badge" style="display:none;font-size:12px"></span>
    <span style="flex:1"></span>
    <input type="text" id="logs-filter" placeholder="Filtrar…" oninput="logsRender()" style="min-width:140px">
    <select id="logs-lines" onchange="logsFetch()">
      <option value="100">100 líneas</option>
      <option value="300" selected>300 líneas</option>
      <option value="1000">1000 líneas</option>
    </select>
    <label style="display:flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap" title="Formato con emojis y colores por severidad">
      <input type="checkbox" id="logs-pretty" checked onchange="logsRender()"> 🎨 Bonito
    </label>
    <label style="display:flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap">
      <input type="checkbox" id="logs-live" onchange="logsLiveToggle()"> En vivo
      <span id="logs-live-dot" class="live-dot" style="display:none" title="Refrescando cada 4 s"></span>
    </label>
    <button class="btn btn-sm" onclick="logsFetch()" title="Refrescar"><i class="ti ti-refresh"></i></button>
    <button class="btn btn-sm" onclick="logsCopy()" title="Copiar"><i class="ti ti-copy"></i></button>
    <button class="btn btn-sm" onclick="logsDownload()" title="Descargar"><i class="ti ti-download"></i></button>
  </div>
  <!-- Filtro extra visible SOLO en pestaña Auditoría -->
  <div id="logs-audit-filter-bar" style="display:none;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
    <input type="text" id="logs-audit-user" list="logs-audit-users" placeholder="Usuario…" oninput="logsRender()" style="min-width:140px">
    <datalist id="logs-audit-users"></datalist>
    <input type="text" id="logs-audit-action" list="logs-audit-actions" placeholder="Acción…" oninput="logsRender()" style="min-width:160px">
    <datalist id="logs-audit-actions"></datalist>
  </div>
  <pre id="log-output" style="font-family:var(--mono);font-size:12px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap;word-break:break-all;max-height:600px;overflow-y:auto">Cargando…</pre>
</div>

<!-- Panel Seguridad -->
<div class="card" id="logs-security-panel" style="display:none">
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
    <div class="card-title">🛡️ Resumen de seguridad</div>
    <select id="logs-sec-hours" onchange="logsFetch()" style="margin-left:auto">
      <option value="1">última hora</option>
      <option value="6">últimas 6 horas</option>
      <option value="24" selected>últimas 24 horas</option>
      <option value="72">últimos 3 días</option>
      <option value="168">últimos 7 días</option>
    </select>
    <button class="btn btn-sm" onclick="logsFetch()" title="Refrescar"><i class="ti ti-refresh"></i></button>
  </div>
  <div id="logs-sec-body" style="color:var(--text-muted)">Cargando…</div>
</div>

<!-- Panel Fail2Ban -->
<div class="card" id="logs-fail2ban-panel" style="display:none">
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
    <div class="card-title">🚫 Fail2Ban</div>
    <span style="flex:1"></span>
    <button class="btn btn-sm" onclick="logsApplyDefaults()" title="Escribe /etc/fail2ban/jail.local con la configuración recomendada por TecXPaneL (bantime incremental, ignoreip con localhost + IP pública, jails sshd/nginx activos). Se guarda backup del anterior."><i class="ti ti-wand"></i> Aplicar defaults</button>
    <button class="btn btn-sm" onclick="logsFetch()" title="Refrescar"><i class="ti ti-refresh"></i></button>
  </div>
  <div id="logs-f2b-body" style="color:var(--text-muted)">Cargando…</div>
</div>

<section class="files-page">
  <div class="files-hero">
    <div>
      <span class="eyebrow"><i class="ti ti-folders"></i> SISTEMA DE ARCHIVOS</span>
      <h1>Archivos del servidor</h1>
      <p>Navega, edita y organiza tus ficheros sin salir del panel.</p>
    </div>
    <div class="files-hero-actions">
      <button class="btn btn-primary" onclick="openModal('modal-new-folder')"><i class="ti ti-folder-plus"></i> Nueva carpeta</button>
      <button class="btn" onclick="openModal('modal-new-file')"><i class="ti ti-file-plus"></i> Nuevo archivo</button>
      <button class="btn btn-sm" onclick="loadFiles()" aria-label="Actualizar"><i class="ti ti-refresh"></i></button>
    </div>
  </div>

  <div id="file-breadcrumb" class="files-toolbar-path" style="margin-bottom:1rem"></div>
  <div class="card">
    <div class="files-toolbar">
      <div class="files-toolbar-path"><i class="ti ti-folder"></i> <span id="files-current-path">/</span></div>
      <span class="badge badge-blue"><i class="ti ti-shield-check"></i> Acceso administrativo</span>
    </div>
    <div id="drop-zone" class="files-drop-zone">
      <i class="ti ti-cloud-upload"></i>
      <strong>Arrastra archivos o carpetas aquí</strong>
      <p>o haz clic para seleccionar archivos</p>
      <input type="file" id="file-upload" hidden multiple onchange="handleFileUpload(event)">
    </div>
    <div id="upload-progress" style="display:none;margin:1rem 1.25rem 0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span id="upload-status" style="font-size:13px;color:var(--text-secondary)">Subiendo...</span>
        <span id="upload-percent" style="font-size:13px;font-weight:600;color:var(--accent)">0%</span>
      </div>
      <div style="width:100%;height:8px;background:var(--bg-card2);border-radius:4px;overflow:hidden"><div id="upload-bar" style="width:0%;height:100%;background:var(--accent);border-radius:4px;transition:width .2s ease"></div></div>
      <div id="upload-detail" style="font-size:11px;color:var(--text-muted);margin-top:4px">0 / 0 archivos</div>
    </div>
    <div class="table-wrap">
      <table class="files-table">
        <thead><tr><th style="width:42px"></th><th>Nombre</th><th>Tamaño</th><th>Modificado</th><th style="width:150px;text-align:right">Acciones</th></tr></thead>
        <tbody id="files-table"><tr><td colspan="5" class="files-empty"><i class="ti ti-loader-2"></i> Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>
</section>
